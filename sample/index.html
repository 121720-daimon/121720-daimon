<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スプリントコンディション分析・練習メニュー自動提案アプリ</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    }
    body {
      background-color: #f4f6f8;
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
    }
    .app-container {
      width: 100%;
      max-width: 540px;
    }
    h1 {
      font-size: 16px;
      font-weight: bold;
      color: #2c3e50;
      text-align: center;
      margin: 12px 0 16px 0;
    }
    fieldset {
      background-color: #ffffff;
      border: 1px solid #d0d7de;
      border-radius: 4px;
      padding: 12px 15px;
      margin-bottom: 12px;
    }
    legend {
      font-size: 13px;
      font-weight: bold;
      color: #2c3e50;
      padding: 0 6px;
    }
    .form-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px 0;
      gap: 10px;
    }
    label {
      font-size: 14px;
      color: #333;
      flex: 1;
    }
    select {
      width: 220px;
      padding: 6px 8px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background-color: #fff;
    }
    .btn-wrapper {
      text-align: center;
      margin: 16px 0;
    }
    button {
      background-color: #27ae60;
      color: white;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      padding: 10px 20px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #219150;
    }
    button:active {
      background-color: #1e8449;
    }
    #output-title {
      font-size: 14px;
      font-weight: bold;
      color: #7f8c8d;
      margin: 4px 0 8px 0;
    }
    #output-detail {
      width: 100%;
      min-height: 240px;
      background-color: #f8f9fa;
      border: 1px solid #d0d7de;
      border-radius: 4px;
      padding: 10px;
      font-size: 13px;
      line-height: 1.5;
      color: #222;
      white-space: pre-wrap;
      overflow-y: auto;
    }
  </style>
</head>
<body>

<div class="app-container">
  <h1>🏃‍♂️ コンディション連動型スプリントメニュー提案 🏃‍♀️</h1>

  <fieldset>
    <legend>本日のコンディション入力</legend>
    
    <div class="form-row">
      <label for="fatigue">1. 今日の疲労度:</label>
      <select id="fatigue">
        <option value="1">1 (絶好調)</option>
        <option value="2" selected>2 (良好)</option>
        <option value="3">3 (普通・やや疲労)</option>
        <option value="4">4 (疲労あり)</option>
        <option value="5">5 (非常に重い)</option>
      </select>
    </div>

    <div class="form-row">
      <label for="pain">2. 身体の違和感・痛み:</label>
      <select id="pain">
        <option value="なし" selected>なし</option>
        <option value="太もも裏（ハムストリングス）">太もも裏（ハムストリングス）</option>
        <option value="脛（シンスプリント気配）">脛（シンスプリント気配）</option>
        <option value="膝">膝</option>
        <option value="足首・ふくらはぎ">足首・ふくらはぎ</option>
      </select>
    </div>

    <div class="form-row">
      <label for="goal">3. 今日の主な目的:</label>
      <select id="goal">
        <option value="スピード・技術向上" selected>スピード・技術向上</option>
        <option value="フォーム意識・リラックス">フォーム意識・リラックス</option>
        <option value="体幹・補強">体幹・補強</option>
        <option value="疲労回復">疲労回復</option>
      </select>
    </div>
  </fieldset>

  <div class="btn-wrapper">
    <button type="button" id="generate-btn">🔍 最適な練習メニューを生成する</button>
  </div>

  <fieldset>
    <legend>判定結果 ＆ 推奨メニュー</legend>
    <div id="output-title">コンディションを入力してボタンを押してください</div>
    <div id="output-detail"></div>
  </fieldset>
</div>

<script>
  document.getElementById("generate-btn").addEventListener("click", function() {
    const fatigue = parseInt(document.getElementById("fatigue").value, 10);
    const pain = document.getElementById("pain").value;
    const goal = document.getElementById("goal").value;

    const titleEl = document.getElementById("output-title");
    const detailEl = document.getElementById("output-detail");

    let resultTitle = "";
    let resultDetail = "";
    let titleColor = "#2c3e50";

    // 1. 痛みの安全判定（怪我予防を最優先）
    if (pain === "太もも裏（ハムストリングス）") {
      titleColor = "#c0392b";
      resultTitle = "【警告】スプリント即中止！リカバリー優先";
      resultDetail = 
        "■ 状態判断: 太もも裏に痛みのサインがあります。肉離れのリスクが極めて高いため、本日のダッシュは全面禁止です。\n\n" +
        "■ 推奨メニュー:\n" +
        " 1. 患部のアイシング ＆ 軽めの静的ストレッチ\n" +
        " 2. 上半身の体幹トレーニング（プランク 30秒×3セット）\n" +
        " 3. 栄養補給 ＆ 早めの就寝\n\n" +
        "※痛みが続く場合は無理をせず専門院を受診してください。";
    } else if (pain === "脛（シンスプリント気配）") {
      titleColor = "#d35400";
      resultTitle = "【注意】走り込み量50%削減 ＆ 補強メイン";
      resultDetail = 
        "■ 状態判断: 脛周辺に負荷がかかっています。着地衝撃を減らし、土台補強に切り替えます。\n\n" +
        "■ 推奨メニュー:\n" +
        " 1. W-Up: 足首・ふくらはぎの丁寧なほぐし\n" +
        " 2. 補強ドリル:\n" +
        "    - グルートブリッジ（お尻の補強） 15回×3セット\n" +
        "    - シングルレッグ・スクワット 各10回\n" +
        " 3. 走力練習: 80%の流し 3本のみ（着地衝撃を抑える）";
    } else if (pain === "膝" || pain === "足首・ふくらはぎ") {
      titleColor = "#d35400";
      resultTitle = "【慎重】低衝撃・フォーム確認ドリル中心";
      resultDetail = 
        "■ 状態判断: 関節・末端部に違和感があります。急加速や切り返しを避け、接地感覚の確認に留めます。\n\n" +
        "■ 推奨メニュー:\n" +
        " 1. W-Up: 芝生やタータンでのウォーキング・動的ストレッチ\n" +
        " 2. 技術ドリル:\n" +
        "    - 腕振りフォーム確認（その場・歩きながら）\n" +
        "    - 股関節の可動域を広げるハードルドリル\n" +
        " 3. 補強: 患部に負担のかからない体幹トレーニング";
    } else if (fatigue >= 4) {
      // 2. 疲労度が高い場合の判定
      titleColor = "#2980b9";
      resultTitle = "【調整】疲労抜き・アクティブレスト優先";
      resultDetail = 
        "■ 状態判断: 痛みはありませんが疲労が蓄積しています。無理に追い込むと怪我やフォーム崩れにつながります。\n\n" +
        "■ 推奨メニュー:\n" +
        " 1. W-Up: 10分間の軽いジョグ ＆ 全身ストレッチ\n" +
        " 2. リラックス走: 70〜75%の力でフォームを意識した流し 60m×3本\n" +
        " 3. C-Down: 股関節・お尻周りの念入りなストレッチ";
    } else {
      // 3. コンディション良好時の目的別メニュー
      titleColor = "#27ae60";
      if (goal === "スピード・技術向上") {
        resultTitle = "【良好】高強度スプリント・トップスピード強化";
        resultDetail = 
          "■ 状態判断: 身体のキレが良い状態です。質の高いダッシュでトップスピードを引き上げましょう。\n\n" +
          "■ 推奨メニュー:\n" +
          " 1. W-Up: 動的ストレッチ ＋ スプリントドリル（スキップ・ハイニー）\n" +
          " 2. メイン走:\n" +
          "    - スタートダッシュ 30m×3本（完全休息）\n" +
          "    - 加速走 60m（20m助走＋40m全力）×3本\n" +
          " 3. C-Down: 軽いジョグ ＆ ストレッチ";
      } else if (goal === "フォーム意識・リラックス") {
        resultTitle = "【良好】リズム・フォーム最適化メニュー";
        resultDetail = 
          "■ 状態判断: 良い状態で技術練習に取り組めます。力みを抜き、大きなストライドを意識しましょう。\n\n" +
          "■ 推奨メニュー:\n" +
          " 1. W-Up: ミニハードル走（接地ポジションの確認）\n" +
          " 2. メイン走:\n" +
          "    - 85%の快調走 100m×4本（肩の力を抜いて弾むイメージ）\n" +
          " 3. C-Down: 股関節周りのストレッチ";
      } else if (goal === "体幹・補強") {
        resultTitle = "【良好】スプリント連動・フィジカル強化";
        resultDetail = 
          "■ 状態判断: 走りを支える体幹とバネを鍛えるのに最適なコンディションです。\n\n" +
          "■ 推奨メニュー:\n" +
          " 1. W-Up: ジョグ ＋ 動的ストレッチ\n" +
          " 2. 補強サーキット（3セット）:\n" +
          "    - バウンディング 30m\n" +
          "    - ランジウォーク 20歩\n" +
          "    - プランク・レッグレイズ 各30秒\n" +
          " 3. 仕上げの流し: 80m×2本";
      } else {
        resultTitle = "【良好】コンディショニング・疲労回復";
        resultDetail = 
          "■ 状態判断: 大きな問題はありません。次のポイント練習に向けて体調を整えましょう。\n\n" +
          "■ 推奨メニュー:\n" +
          " 1. 15分間のリラックスジョグ\n" +
          " 2. 全身の静的ストレッチ（特に腸腰筋・ハムストリングス）\n" +
          " 3. 軽い体幹トレーニング（ドローイン・ヒップリフト）";
      }
    }

    titleEl.style.color = titleColor;
    titleEl.textContent = resultTitle;
    detailEl.textContent = resultDetail;
  });
</script>

</body>
</html>
