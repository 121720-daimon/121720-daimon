<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TRACK & FIELD PRO | 陸上部メニュー・男女別コンディション＆青春ラボ</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #090d16;
      background-image: 
        radial-gradient(circle at 20% 0%, rgba(56, 189, 248, 0.25) 0%, transparent 45%),
        radial-gradient(circle at 80% 0%, rgba(250, 204, 21, 0.25) 0%, transparent 45%),
        repeating-linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.08) 0px,
          rgba(255, 255, 255, 0.08) 3px,
          transparent 3px,
          transparent 64px
        ),
        linear-gradient(180deg, #0f172a 0%, #7f1d1d 60%, #450a0a 100%);
      color: #0f172a;
      margin: 0;
      padding: 0 0 85px 0;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      font-size: 16px;
    }
    .app-container {
      width: 100%;
      max-width: 680px;
      padding: 12px 14px;
    }

    /* スマホアプリ風トップバー */
    .app-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      padding: 12px 16px;
      border-radius: 16px;
      margin-bottom: 12px;
      border: 2px solid #facc15;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
    }
    .app-logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .app-logo-title {
      font-size: 18px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.2;
    }
    .app-logo-sub {
      font-size: 11px;
      font-weight: 800;
      color: #facc15;
    }
    .btn-qr-mini {
      background: linear-gradient(135deg, #f59e0b, #ec4899, #8b5cf6);
      color: #ffffff;
      font-size: 13px;
      font-weight: 900;
      border: none;
      border-radius: 20px;
      padding: 8px 14px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(236, 72, 153, 0.4);
    }

    /* ランク＆経験値ステータスバー */
    .rank-bar {
      background: linear-gradient(90deg, #1e293b, #0f172a);
      border: 1px solid #38bdf8;
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #f8fafc;
    }
    .rank-badge {
      background: #0284c7;
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      padding: 3px 10px;
      border-radius: 6px;
    }
    .rank-count {
      font-size: 13px;
      font-weight: 800;
      color: #facc15;
    }

    /* タブ画面切り替え */
    .tab-view {
      display: none;
    }
    .tab-view.active {
      display: block;
      animation: fadeIn 0.2s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .quote-box {
      background: #fffbeb;
      border-left: 7px solid #f59e0b;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 14px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
    }
    .quote-text {
      font-size: 15px;
      font-weight: 900;
      color: #78350f;
      margin: 0 0 4px 0;
      line-height: 1.5;
    }
    .quote-author {
      font-size: 13px;
      color: #b45309;
      text-align: right;
      margin: 0;
      font-weight: bold;
    }

    .card {
      background-color: #ffffff;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
      border-top: 6px solid #f59e0b;
    }
    .card-title {
      font-size: 18px;
      font-weight: 900;
      color: #0f172a;
      border-bottom: 3px solid #f1f5f9;
      padding-bottom: 10px;
      margin: 0 0 14px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-row {
      display: flex;
      flex-direction: column;
      margin-bottom: 13px;
    }
    @media (min-width: 540px) {
      .form-row {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
    }
    label {
      font-size: 15px;
      font-weight: 900;
      color: #1e293b;
      margin-bottom: 5px;
    }
    select, input[type="text"] {
      width: 100%;
      max-width: 310px;
      padding: 10px 12px;
      font-size: 15px;
      font-weight: bold;
      color: #0f172a;
      border: 2px solid #94a3b8;
      border-radius: 10px;
      background-color: #f8fafc;
    }
    select:focus, input[type="text"]:focus {
      outline: none;
      border-color: #f97316;
      background-color: #ffffff;
    }

    /* 性別選択ボタン（男子・女子） */
    .gender-switch {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 310px;
    }
    .gender-btn {
      flex: 1;
      padding: 10px;
      font-size: 15px;
      font-weight: 900;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      background: #f8fafc;
      color: #475569;
      cursor: pointer;
      text-align: center;
    }
    .gender-btn.active-male {
      background: #e0f2fe;
      border-color: #0284c7;
      color: #0369a1;
    }
    .gender-btn.active-female {
      background: #fce7f3;
      border-color: #db2777;
      color: #be185d;
    }

    /* 女子専用コンディション枠 */
    .female-only-row {
      background: #fdf2f8;
      border: 2px solid #f9a8d4;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 13px;
      display: none;
    }
    .female-only-row label {
      color: #9d174d;
    }
    .female-only-row select {
      border-color: #f472b6;
      background: #ffffff;
    }

    .btn-main {
      width: 100%;
      background: linear-gradient(90deg, #f97316 0%, #facc15 100%);
      color: #0f172a;
      font-size: 18px;
      font-weight: 900;
      border: none;
      border-radius: 12px;
      padding: 16px 20px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(249, 115, 22, 0.5);
      margin-top: 6px;
    }

    /* 目標＆時間バッジ表示 */
    .goal-banner {
      background: linear-gradient(90deg, #0f172a, #1e293b);
      color: #facc15;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 900;
      margin-bottom: 12px;
      display: none;
      line-height: 1.6;
    }

    #result-status {
      font-size: 17px;
      font-weight: 900;
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 14px;
      background-color: #f1f5f9;
      color: #334155;
      line-height: 1.4;
    }
    .summary-text {
      font-size: 15px;
      line-height: 1.7;
      color: #1e293b;
      background: #f8fafc;
      padding: 12px 14px;
      border-radius: 10px;
      border-left: 5px solid #f59e0b;
      margin-bottom: 16px;
    }

    /* フェーズ区切り */
    .phase-label {
      display: inline-block;
      font-size: 13px;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 6px;
      color: #ffffff;
    }
    .phase-wup { background: #0284c7; }
    .phase-main { background: #dc2626; }
    .phase-weight { background: #7c3aed; }
    .phase-cdown { background: #059669; }
    .phase-female { background: #db2777; }

    .menu-item {
      border: 2px solid #cbd5e1;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 16px;
      background: #ffffff;
    }
    .menu-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .menu-name {
      font-size: 17px;
      font-weight: 900;
      color: #0f172a;
      line-height: 1.4;
    }
    .badge-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .time-badge {
      background: #0f172a;
      color: #facc15;
      font-size: 13px;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 6px;
    }
    .target-tag {
      background: #fef3c7;
      color: #92400e;
      font-size: 13px;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 6px;
    }

    /* 7種目リスト表示 */
    .drill-grid {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 12px;
      margin: 10px 0;
    }
    .drill-grid-title {
      font-size: 14px;
      font-weight: 900;
      color: #0f172a;
      margin: 0 0 8px 0;
    }
    .drill-step {
      font-size: 14px;
      line-height: 1.6;
      color: #1e293b;
      padding: 5px 0;
      border-bottom: 1px dashed #cbd5e1;
    }
    .drill-step:last-child {
      border-bottom: none;
    }

    /* 休憩バッジ・ボックス */
    .rest-banner {
      background: #ecfeff;
      border: 2px solid #06b6d4;
      color: #0e7490;
      border-radius: 10px;
      padding: 10px 12px;
      margin: 10px 0;
      font-size: 15px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* SVGイラスト図解ボックス */
    .visual-guide {
      background: #f1f5f9;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px;
      margin: 10px 0;
      text-align: center;
    }
    .visual-guide svg {
      max-width: 100%;
      height: 115px;
      display: block;
      margin: 0 auto;
    }
    .visual-caption {
      font-size: 13px;
      font-weight: 800;
      color: #475569;
      margin-top: 4px;
    }

    .menu-desc {
      font-size: 15px;
      line-height: 1.7;
      color: #1e293b;
      margin: 8px 0;
    }
    .point-box {
      margin-top: 10px;
      font-size: 14px;
      color: #0369a1;
      background: #e0f2fe;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 800;
      line-height: 1.5;
    }

    /* 青春＆恋愛アドバイス・男女別ミッションカード */
    .youth-card {
      background: linear-gradient(135deg, #fff1f2 0%, #ffe4e6 100%);
      border: 2px solid #fb7185;
      border-radius: 14px;
      padding: 16px;
      margin-top: 16px;
    }
    .youth-title {
      font-size: 17px;
      font-weight: 900;
      color: #be123c;
      margin: 0 0 8px 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .youth-text {
      font-size: 15px;
      line-height: 1.7;
      color: #881337;
      margin: 0;
    }

    .boys-challenge {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 2px solid #facc15;
      border-radius: 14px;
      padding: 16px;
      margin-top: 16px;
      color: #ffffff;
    }
    .boys-title {
      font-size: 17px;
      font-weight: 900;
      color: #facc15;
      margin: 0 0 8px 0;
    }
    .boys-text {
      font-size: 15px;
      line-height: 1.7;
      color: #e2e8f0;
      margin: 0;
    }

    /* 青春相談室の個別ボタン */
    .topic-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .topic-btn {
      background: #f1f5f9;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      padding: 10px;
      font-size: 14px;
      font-weight: 900;
      color: #1e293b;
      cursor: pointer;
      text-align: center;
    }
    .topic-btn.active {
      background: #ffe4e6;
      border-color: #e11d48;
      color: #be123c;
    }

    /* チーム共有＆友達追加セクション */
    .share-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }
    .btn-line {
      background: #06c755;
      color: white;
      font-size: 15px;
      font-weight: 900;
      border: none;
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
    }
    .btn-copy {
      background: #334155;
      color: white;
      font-size: 15px;
      font-weight: 900;
      border: none;
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
    }
    .member-input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .member-input-row input {
      max-width: none;
      flex: 1;
    }
    .btn-add {
      background: #f97316;
      color: white;
      font-size: 15px;
      font-weight: 900;
      border: none;
      border-radius: 10px;
      padding: 0 18px;
      cursor: pointer;
      white-space: nowrap;
    }
    .member-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .member-chip {
      background: #ffedd5;
      color: #9a3412;
      font-size: 14px;
      font-weight: 900;
      padding: 8px 14px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .member-chip span {
      cursor: pointer;
      color: #ea580c;
      font-size: 16px;
    }

    /* 下部固定ナビゲーションバー */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.98);
      backdrop-filter: blur(10px);
      border-top: 2px solid #334155;
      display: flex;
      justify-content: space-around;
      padding: 8px 4px 10px 4px;
      z-index: 900;
    }
    .nav-item {
      background: none;
      border: none;
      color: #94a3b8;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 10px;
      flex: 1;
      max-width: 140px;
    }
    .nav-item.active {
      color: #facc15;
      background: rgba(250, 204, 21, 0.12);
    }
    .nav-icon {
      font-size: 20px;
      line-height: 1;
    }

    /* QRコードモーダル */
    .qr-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(9, 13, 22, 0.88);
      backdrop-filter: blur(6px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .qr-card {
      background: linear-gradient(135deg, #f59e0b 0%, #ec4899 50%, #6366f1 100%);
      padding: 5px;
      border-radius: 24px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
    }
    .qr-inner {
      background: #ffffff;
      border-radius: 20px;
      padding: 24px 20px;
      text-align: center;
    }
    .qr-user-title {
      font-size: 20px;
      font-weight: 900;
      color: #0f172a;
      margin: 0 0 6px 0;
    }
    .qr-user-sub {
      font-size: 14px;
      font-weight: 900;
      color: #e11d48;
      margin: 0 0 16px 0;
    }
    .qr-frame {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      padding: 14px;
      display: inline-block;
      margin-bottom: 12px;
    }
    .qr-frame img {
      display: block;
      width: 210px;
      height: 210px;
    }
    .qr-hint {
      font-size: 14px;
      color: #334155;
      line-height: 1.5;
      margin: 0 0 16px 0;
    }
    .btn-qr-close {
      width: 100%;
      background: #0f172a;
      color: #ffffff;
      font-size: 16px;
      font-weight: 900;
      border: none;
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- アプリ風トップバー -->
  <div class="app-topbar">
    <div class="app-logo">
      <span style="font-size:28px;">🔥</span>
      <div>
        <div class="app-logo-title">TRACK & FIELD PRO</div>
        <div class="app-logo-sub">高校陸上部・男女別強化＆青春ラボ</div>
      </div>
    </div>
    <button type="button" class="btn-qr-mini" id="open-qr-btn">📱 QR友達追加</button>
  </div>

  <!-- ランク表示バー -->
  <div class="rank-bar">
    <div>
      <span class="rank-badge" id="athlete-rank">階級：ルーキーアスリート</span>
    </div>
    <div class="rank-count" id="practice-count-display">メニュー生成：0回達成</div>
  </div>

  <!-- ========================================== -->
  <!-- タブ1：今日のメニュー作成画面 -->
  <!-- ========================================== -->
  <div id="tab-menu" class="tab-view active">
    <div class="quote-box">
      <p class="quote-text" id="quote-text">「金メダルは練習場でつくられる。試合はただそれを取りに行くだけの場所だ。」</p>
      <p class="quote-author" id="quote-author">- 陸上メダリスト格言</p>
    </div>

    <div class="card">
      <div class="card-title">⚡ あなたの性別・種目・体調を入力</div>
      
      <div class="form-row">
        <label for="athlete-name">👤 自分の名前（QR・共有用）</label>
        <input type="text" id="athlete-name" placeholder="例：陸上部 翔太 / 美咲">
      </div>

      <!-- 男女選択スイッチ -->
      <div class="form-row">
        <label>🚻 性別（男子・女子）</label>
        <div class="gender-switch">
          <button type="button" class="gender-btn active-male" id="btn-male">👦 男子</button>
          <button type="button" class="gender-btn" id="btn-female">👧 女子</button>
        </div>
      </div>

      <!-- 女子選択時のみ表示される体調・生理周期選択 -->
      <div class="female-only-row" id="female-cycle-row">
        <div class="form-row" style="margin-bottom:0;">
          <label for="female-cycle">🌸 女子コンディション（生理周期）</label>
          <select id="female-cycle">
            <option value="通常（好調期）" selected>✨ 通常（生理後〜好調期・動ける！）</option>
            <option value="生理中（1〜3日目・つらい）">🩸 生理中（1〜3日目・お腹や腰が重い）</option>
            <option value="生理中（4日目以降・軽め）">🌷 生理中（後半・少しずつ動ける）</option>
            <option value="生理前（PMS・だるさあり）">☁️ 生理前（身体が重い・むくみやすい）</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <label for="event-type">🏅 専門ブロック（種目）</label>
        <select id="event-type">
          <option value="短距離" selected>⚡ 短距離・ハードル（100m〜400mH）</option>
          <option value="長距離">👟 中・長距離・競歩（800m〜駅伝）</option>
          <option value="跳躍">🦘 跳躍（走幅跳・三段跳・走高跳・棒高跳）</option>
          <option value="投擲">☄️ 投擲（砲丸・円盤・やり・ハンマー）</option>
        </select>
      </div>

      <div class="form-row">
        <label for="target-aim">🎯 目指している目標</label>
        <select id="target-aim">
          <option value="インターハイ・全国大会出場！" selected>🏆 インターハイ・全国大会出場！</option>
          <option value="県大会・ブロック大会突破！">🔥 県大会・ブロック大会突破！</option>
          <option value="自己ベスト（PB）更新！">⚡ 自己ベスト（PB）更新！</option>
          <option value="怪我ゼロで毎日楽しく継続！">🛡️ 怪我ゼロで毎日楽しく継続！</option>
        </select>
      </div>

      <div class="form-row">
        <label for="practice-time">⏱️ 今日の練習時間</label>
        <select id="practice-time">
          <option value="30">30分（朝練・短時間集中）</option>
          <option value="60">1時間（60分：ショート練習）</option>
          <option value="90">1時間30分（90分：標準メニュー）</option>
