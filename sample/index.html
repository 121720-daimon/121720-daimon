<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRACK & FIELD PRO LAB | 陸上部メニュー・図解・メンタル管理</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    }
    /* ナイトスタジアムの照明とレッドトラックをイメージした迫力ある背景 */
    body {
      background-color: #090d16;
      background-image: 
        radial-gradient(circle at 20% 0%, rgba(56, 189, 248, 0.28) 0%, transparent 45%),
        radial-gradient(circle at 80% 0%, rgba(250, 204, 21, 0.28) 0%, transparent 45%),
        repeating-linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.09) 0px,
          rgba(255, 255, 255, 0.09) 3px,
          transparent 3px,
          transparent 64px
        ),
        linear-gradient(180deg, #0f172a 0%, #7f1d1d 60%, #450a0a 100%);
      color: #0f172a;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      font-size: 16px;
    }
    .app-container {
      width: 100%;
      max-width: 680px;
    }
    header {
      text-align: center;
      background: linear-gradient(145deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.95));
      padding: 20px 16px;
      border-radius: 18px;
      margin-bottom: 16px;
      border: 2px solid #facc15;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }
    .hero-icons {
      font-size: 36px;
      line-height: 1.1;
      margin-bottom: 6px;
      filter: drop-shadow(0 0 12px rgba(250, 204, 21, 0.7));
    }
    .badge {
      display: inline-block;
      background: linear-gradient(90deg, #facc15, #f97316);
      color: #0f172a;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1px;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 24px;
      font-weight: 900;
      color: #ffffff;
      margin: 0;
      line-height: 1.3;
    }
    .header-actions {
      margin-top: 14px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn-qr-open {
      background: linear-gradient(135deg, #f59e0b, #ec4899, #8b5cf6);
      color: #ffffff;
      font-size: 15px;
      font-weight: 900;
      border: none;
      border-radius: 24px;
      padding: 10px 20px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.5);
    }

    .quote-box {
      background: #fffbeb;
      border-left: 7px solid #f59e0b;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 16px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
    }
    .quote-text {
      font-size: 16px;
      font-weight: 900;
      color: #78350f;
      margin: 0 0 6px 0;
      line-height: 1.5;
    }
    .quote-author {
      font-size: 14px;
      color: #b45309;
      text-align: right;
      margin: 0;
      font-weight: bold;
    }

    .card {
      background-color: #ffffff;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.4);
      border-top: 6px solid #f59e0b;
    }
    .card-title {
      font-size: 18px;
      font-weight: 900;
      color: #0f172a;
      border-bottom: 3px solid #f1f5f9;
      padding-bottom: 10px;
      margin: 0 0 16px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-row {
      display: flex;
      flex-direction: column;
      margin-bottom: 14px;
    }
    @media (min-width: 540px) {
      .form-row {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
    }
    label {
      font-size: 16px;
      font-weight: 900;
      color: #1e293b;
      margin-bottom: 6px;
    }
    select, input[type="text"] {
      width: 100%;
      max-width: 310px;
      padding: 11px 14px;
      font-size: 16px;
      font-weight: bold;
      color: #0f172a;
      border: 2px solid #94a3b8;
      border-radius: 10px;
      background-color: #f8fafc;
    }
    select:focus, input[type="text"]:focus {
      outline: none;
      border-color: #f97316;
      background-color: #ffffff;
    }
    .btn-main {
      width: 100%;
      background: linear-gradient(90deg, #f97316 0%, #facc15 100%);
      color: #0f172a;
      font-size: 18px;
      font-weight: 900;
      border: none;
      border-radius: 12px;
      padding: 16px 20px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(249, 115, 22, 0.5);
      margin-top: 8px;
    }

    /* 目標＆時間バッジ表示 */
    .goal-banner {
      background: linear-gradient(90deg, #0f172a, #1e293b);
      color: #facc15;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 900;
      margin-bottom: 12px;
      display: none;
      line-height: 1.6;
    }

    #result-status {
      font-size: 18px;
      font-weight: 900;
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 14px;
      background-color: #f1f5f9;
      color: #334155;
      line-height: 1.4;
    }
    .summary-text {
      font-size: 15px;
      line-height: 1.7;
      color: #1e293b;
      background: #f8fafc;
      padding: 12px 14px;
      border-radius: 10px;
      border-left: 5px solid #f59e0b;
      margin-bottom: 16px;
    }

    /* フェーズ区切り（W-Up / メイン / ウエイト / C-Down） */
    .phase-label {
      display: inline-block;
      font-size: 13px;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 6px;
      color: #ffffff;
    }
    .phase-wup { background: #0284c7; }
    .phase-main { background: #dc2626; }
    .phase-weight { background: #7c3aed; }
    .phase-cdown { background: #059669; }

    .menu-item {
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
      background: #ffffff;
    }
    .menu-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .menu-name {
      font-size: 17px;
      font-weight: 900;
      color: #0f172a;
      line-height: 1.4;
    }
    .badge-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .time-badge {
      background: #0f172a;
      color: #facc15;
      font-size: 13px;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 6px;
    }
    .target-tag {
      background: #fef3c7;
      color: #92400e;
      font-size: 13px;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 6px;
    }

    /* SVGイラスト図解ボックス */
    .visual-guide {
      background: #f1f5f9;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px;
      margin: 10px 0;
      text-align: center;
    }
    .visual-guide svg {
      max-width: 100%;
      height: 115px;
      display: block;
      margin: 0 auto;
    }
    .visual-caption {
      font-size: 13px;
      font-weight: 800;
      color: #475569;
      margin-top: 4px;
    }

    .menu-desc {
      font-size: 15px;
      line-height: 1.7;
      color: #1e293b;
      margin: 8px 0;
    }
    .point-box {
      margin-top: 10px;
      font-size: 14px;
      color: #0369a1;
      background: #e0f2fe;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 800;
      line-height: 1.5;
    }

    /* トップ選手メニュー＆メンタルコラムボックス */
    .pro-column-box {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: #f8fafc;
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
      border: 2px solid #38bdf8;
    }
    .pro-column-title {
      font-size: 16px;
      font-weight: 900;
      color: #38bdf8;
      margin: 0 0 8px 0;
    }
    .pro-column-text {
      font-size: 15px;
      line-height: 1.7;
      margin: 0 0 12px 0;
      color: #e2e8f0;
    }
    .mental-title {
      font-size: 16px;
      font-weight: 900;
      color: #facc15;
      margin: 0 0 6px 0;
    }

    /* チーム共有＆友達追加セクション */
    .share-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }
    .btn-line {
      background: #06c755;
      color: white;
      font-size: 15px;
      font-weight: 900;
      border: none;
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
    }
    .btn-copy {
      background: #334155;
      color: white;
      font-size: 15px;
      font-weight: 900;
      border: none;
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
    }
    .member-box {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 2px dashed #cbd5e1;
    }
    .member-input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .member-input-row input {
      max-width: none;
      flex: 1;
    }
    .btn-add {
      background: #f97316;
      color: white;
      font-size: 15px;
      font-weight: 900;
      border: none;
      border-radius: 10px;
      padding: 0 18px;
      cursor: pointer;
      white-space: nowrap;
    }
    .member-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .member-chip {
      background: #ffedd5;
      color: #9a3412;
      font-size: 14px;
      font-weight: 900;
      padding: 6px 12px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .member-chip span {
      cursor: pointer;
      color: #ea580c;
      font-size: 16px;
    }

    /* インスタ風 QRコードモーダル */
    .qr-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(9, 13, 22, 0.88);
      backdrop-filter: blur(6px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .qr-card {
      background: linear-gradient(135deg, #f59e0b 0%, #ec4899 50%, #6366f1 100%);
      padding: 5px;
      border-radius: 24px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
    }
    .qr-inner {
      background: #ffffff;
      border-radius: 20px;
      padding: 24px 20px;
      text-align: center;
    }
    .qr-user-title {
      font-size: 20px;
      font-weight: 900;
      color: #0f172a;
      margin: 0 0 6px 0;
    }
    .qr-user-sub {
      font-size: 14px;
      font-weight: 900;
      color: #e11d48;
      margin: 0 0 16px 0;
    }
    .qr-frame {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      padding: 14px;
      display: inline-block;
      margin-bottom: 12px;
    }
    .qr-frame img {
      display: block;
      width: 210px;
      height: 210px;
    }
    .qr-hint {
      font-size: 14px;
      color: #334155;
      line-height: 1.5;
      margin: 0 0 16px 0;
    }
    .btn-qr-close {
      width: 100%;
      background: #0f172a;
      color: #ffffff;
      font-size: 16px;
      font-weight: 900;
      border: none;
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <div class="hero-icons">🏟️🥇🏃‍♂️🔥🏆</div>
    <div class="badge">TRACK & FIELD PRO TRAINING LAB</div>
    <h1>陸上競技 メニュー図解＆体調管理</h1>
    <div class="header-actions">
      <button type="button" class="btn-qr-open" id="open-qr-btn">📱 自分のQRコードで友達追加</button>
    </div>
  </header>

  <div class="quote-box">
    <p class="quote-text" id="quote-text">「金メダルは練習場でつくられる。試合はただそれを取りに行くだけの場所だ。」</p>
    <p class="quote-author" id="quote-author">- 陸上メダリスト格言</p>
  </div>

  <!-- 1. 入力フォームカード -->
  <div class="card">
    <div class="card-title">🔥 あなたの種目・環境・体調を入力！</div>
    
    <div class="form-row">
      <label for="athlete-name">👤 自分の名前（QR・共有用）</label>
      <input type="text" id="athlete-name" placeholder="例：陸上部 太郎">
    </div>

    <div class="form-row">
      <label for="event-type">🏅 専門ブロック（種目）</label>
      <select id="event-type">
        <option value="短距離" selected>⚡ 短距離・ハードル（100m〜400mH）</option>
        <option value="長距離">👟 中・長距離・競歩（800m〜駅伝）</option>
        <option value="跳躍">🦘 跳躍（走幅跳・三段跳・走高跳・棒高跳）</option>
        <option value="投擲">☄️ 投擲（砲丸・円盤・やり・ハンマー）</option>
      </select>
    </div>

    <div class="form-row">
      <label for="target-aim">🎯 目指している目標</label>
      <select id="target-aim">
        <option value="インターハイ・全国大会出場！" selected>🏆 インターハイ・全国大会出場！</option>
        <option value="県大会・ブロック大会突破！">🔥 県大会・ブロック大会突破！</option>
        <option value="自己ベスト（PB）更新！">⚡ 自己ベスト（PB）更新！</option>
        <option value="怪我ゼロで毎日楽しく継続！">🛡️ 怪我ゼロで毎日楽しく継続！</option>
      </select>
    </div>

    <div class="form-row">
      <label for="practice-time">⏱️ 今日の練習時間</label>
      <select id="practice-time">
        <option value="30">30分（朝練・短時間集中）</option>
        <option value="60">1時間（60分：ショート練習）</option>
        <option value="90">1時間30分（90分：標準メニュー）</option>
        <option value="120" selected>2時間（120分：しっかり強化）</option>
        <option value="150">2時間30分（150分：本格強化）</option>
        <option value="180">3時間（180分：休日・合同練習）</option>
        <option value="210">3時間30分（210分：たっぷり練習）</option>
        <option value="240">4時間（240分：半日・合宿レベル）</option>
      </select>
    </div>

    <div class="form-row">
      <label for="weight-env">🏋️ ウエイト器具の有無</label>
      <select id="weight-env">
        <option value="あり" selected>🏋️ あり（ベンチプレス・スクワット等）</option>
        <option value="なし">🤸 なし（グラウンド・自重トレーニングのみ）</option>
      </select>
    </div>

    <div class="form-row">
      <label for="fatigue">🔋 今日の疲労度</label>
      <select id="fatigue">
        <option value="1">1：絶好調（身体が軽い・キレ抜群！）</option>
        <option value="2" selected>2：良好（いつも通り動ける）</option>
        <option value="3">3：普通（やや張り・疲れあり）</option>
        <option value="4">4：疲労あり（重だるい・休息も視野）</option>
        <option value="5">5：限界（非常に重い・無理禁物）</option>
      </select>
    </div>

    <div class="form-row">
      <label for="pain">🩹 身体の違和感・痛み</label>
      <select id="pain">
        <option value="なし" selected>なし（ベストコンディション！）</option>
        <option value="太もも裏（ハムストリングス）">太もも裏（ハムストリングス）</option>
        <option value="脛・ふくらはぎ（シンスプ気配）">脛・ふくらはぎ（シンスプ気配）</option>
        <option value="膝・股関節">膝・股関節まわり</option>
        <option value="腰・肩・肘（投擲/跳躍負荷）">腰・肩・肘まわり</option>
      </select>
    </div>

    <button type="button" class="btn-main" id="generate-btn">⚡ 図解つき個別フルメニューを生成！</button>
  </div>

  <!-- 2. 判定結果カード -->
  <div class="card">
    <div class="card-title">📋 あなた専用のフル練習メニュー（図解つき）</div>
    <div class="goal-banner" id="goal-banner"></div>
    <div id="result-status">上の項目を選んでボタンを押してね！</div>
    <div id="result-container"></div>

    <!-- トップ選手メニュー＆メンタル維持講座 -->
    <div id="pro-academy" style="display:none;"></div>

    <!-- チーム共有エリア -->
    <div id="share-section" style="display:none;">
      <div class="share-grid">
        <button type="button" class="btn-line" id="line-share-btn">💬 LINEで仲間に送る</button>
        <button type="button" class="btn-copy" id="copy-share-btn">📋 メニューをコピー</button>
      </div>
    </div>

    <!-- 陸上部メンバーリスト（端末保存） -->
    <div class="member-box">
      <div style="font-size:15px; font-weight:900; color:#1e293b; margin-bottom:8px;">
        🤝 陸上部メンバーリスト（タップで名前切替）
      </div>
      <div class="member-input-row">
        <input type="text" id="new-member-input" placeholder="部員の名前を入力（例：佐藤）">
        <button type="button" class="btn-add" id="add-member-btn">＋追加</button>
      </div>
      <div class="member-list" id="member-list"></div>
    </div>
  </div>
</div>

<!-- インスタ風 QRコードモーダル -->
<div class="qr-modal" id="qr-modal">
  <div class="qr-card">
    <div class="qr-inner">
      <div style="font-size:32px; margin-bottom:4px;">🏅🏃‍♂️💨</div>
      <h2 class="qr-user-title" id="qr-display-name">陸上部メンバー</h2>
      <p class="qr-user-sub" id="qr-display-info">短距離 ｜ 目標：インターハイ出場！</p>
      <div class="qr-frame">
        <img id="qr-image" src="" alt="プロフィールQRコード">
      </div>
      <p class="qr-hint">
        スマホのカメラで読み取ると、このアプリが開いて<br>
        <strong>自動的にメンバーリストに友達追加</strong>されます！
      </p>
      <button type="button" class="btn-qr-close" id="close-qr-btn">閉じる</button>
    </div>
  </div>
</div>

<script>
  // イラスト図解（SVG）ライブラリ
  const illustrations = {
    dynamicStretch: `
      <svg viewBox="0 0 260 110">
        <rect x="10" y="92" width="240" height="6" rx="3" fill="#cbd5e1"/>
        <!-- 体幹と脚振り -->
        <circle cx="95" cy="24" r="9" fill="#f97316"/>
        <line x1="95" y1="33" x2="95" y2="62" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
        <line x1="95" y1="62" x2="95" y2="92" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
        <!-- 前に振り上げる脚 -->
        <line x1="95" y1="62" x2="145" y2="45" stroke="#e11d48" stroke-width="5" stroke-linecap="round"/>
        <path d="M 135 75 Q 155 60 148 42" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4,3"/>
        <polygon points="148,38 142,46 153,46" fill="#f59e0b"/>
        <text x="165" y="55" font-size="12" font-weight="bold" fill="#0f172a">反動を使って</text>
        <text x="165" y="72" font-size="12" font-weight="bold" fill="#e11d48">大きく股関節回し！</text>
      </svg>`,
    sprintDrill: `
      <svg viewBox="0 0 260 110">
        <rect x="10" y="92" width="240" height="6" rx="3" fill="#cbd5e1"/>
        <circle cx="105" cy="20" r="9" fill="#f97316"/>
        <line x1="105" y1="29" x2="100" y2="58" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
        <!-- 軸足 -->
        <line x1="100" y1="58" x2="95" y2="92" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
        <!-- 90度に引き上げた腿 -->
        <line x1="100" y1="58" x2="132" y2="55" stroke="#e11d48" stroke-width="5" stroke-linecap="round"/>

    } else {
      // 3. コンディション良好！種目ブロック別フルメニュー

          },
          {
            phase: "3. ウエイト・フィジカル補強",

        ];
      } else if (eventType === "長距離") {

              : "フロント＆サイドプランク（各40秒×3セット）とウォーキングランジ（20歩×2セット）で終盤のフォーム崩れを防ぎます。",

        ];

        const jumpReps = totalMins <= 60 ? "短助走跳躍 × 4本" : (totalMins >= 180 ? "短助走×5本 ＋ 全助走跳躍×5本" : "助走合わせ ＋ 跳躍 × 6本");

        ];

    }

    statusEl.textContent = statusTitle;
    containerEl.innerHTML = createMenuHTML(summary, menus);

    // トップ選手メニュー＆メンタル維持講座の表示
    const knowledge = proKnowledge[eventType];
    proEl.style.display = "block";
    proEl.innerHTML = `
      <div class="pro-column-box">
        <div class="pro-column-title">${knowledge.proTitle}</div>
        <p class="pro-column-text">${knowledge.proText}</p>
        <div class="mental-title">${knowledge.mentalTitle}</div>
        <p class="pro-column-text" style="margin-bottom:0;">${knowledge.mentalText}</p>
      </div>
    `;

    // 共有用テキストを作成
    const menuNames = menus.map(m => `・${m.name}（${m.duration}分）`).join("\n");
    latestShareText = 
      `🥇【陸上部メニュー共有】\n` +
      `名前：${name}（${eventType}）\n` +
      `目標：${targetAim}\n` +
      `時間：${timeLabel}（器具：${weightEnv}）\n` +
      `判定：${statusTitle}\n\n` +
      `▼今日のメニュー\n${menuNames}\n\n` +
      `今日も自己ベスト＆表彰台目指して頑張ろう🔥`;

    document.getElementById("share-section").style.display = "block";
  });

  // LINEで送るボタン
  document.getElementById("line-share-btn").addEventListener("click", () => {
    if (!latestShareText) return;
    const url = "https://line.me/R/msg/text/?" + encodeURIComponent(latestShareText);
    window.open(url, "_blank");
  });

  // コピーボタン
  document.getElementById("copy-share-btn").addEventListener("click", () => {
    if (!latestShareText) return;
    navigator.clipboard.writeText(latestShareText).then(() => {
      alert("今日のメニューをコピーしました！LINEグループやメモに貼り付けて共有できます🔥");
    });
  });
</script>
